aid: general-catalyst
name: General Catalyst
description: >-
  General Catalyst is a global venture capital and investment firm founded in
  2000 by Joel Cutler and David Fialkow, headquartered in Cambridge,
  Massachusetts, with offices in San Francisco, New York, London, Berlin,
  Bengaluru, and Washington, D.C. The firm invests across seed, venture, and
  growth stages and manages more than $43 billion in assets under management
  (as of December 2024), backing 900+ portfolio companies. General Catalyst
  operates through distinct capital vehicles and initiatives — Ignition/Seed
  for early-stage, Endurance/Grow for growth, Creation for company building,
  and a dedicated Health Assurance practice for healthcare transformation. Its
  current "Global Resilience" thesis, led by CEO Hemant Taneja, concentrates on
  the critical systems that underpin modern society — healthcare, energy,
  defense, and AI — alongside an "unscaling" thesis that uses data and AI to
  personalize core societal services. Notable investments include Airbnb,
  Stripe, Anthropic, Canva, HubSpot, Ramp, Anduril, Applied Intuition, Samsara,
  Mistral, Helsing, Hippocratic AI, and Mercor.
